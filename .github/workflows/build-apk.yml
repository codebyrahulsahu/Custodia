name: Build Android APK

on:
  push:
    branches: [ main ] # Agar aapki branch master hai toh yahan master likhein

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant Execute Permission for Gradlew
      run: chmod +x ./android/gradlew
      # Agar aapka folder 'android' nahi kuch aur hai, toh upar 'android' ki jagah us folder ka naam likhein

    - name: Build APK
      run: ./android/gradlew assembleDebug
      # Agar folder ka naam alag hai, toh yahan bhi badlein

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
# trigger
