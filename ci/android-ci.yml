name: Android CI

on:
  push:
    branches: [ main, 'arena/**' ]
    paths-ignore:
      - '**.md'
      - '**.apk'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Which APK to build'
        type: choice
        default: debug
        options: [ debug, release, both ]
      run_tests:
        description: 'Run unit tests before packaging'
        type: boolean
        default: true

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUILD_TYPE: ${{ github.event.inputs.build_type || 'debug' }}
  RUN_TESTS: ${{ github.event.inputs.run_tests || 'true' }}
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false -Dkotlin.compiler.execution.strategy=in-process

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Create signing keystores
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -storepass android -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          if [ -n "${RELEASE_KEYSTORE_BASE64:-}" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
            echo "Using repository release keystore."
          else
            echo "No RELEASE_KEYSTORE_BASE64 secret: generating an ephemeral upload key."
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -storepass android -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Custodia CI,O=Custodia,C=US"
          fi

      - name: Run unit tests
        if: env.RUN_TESTS == 'true'
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        if: env.BUILD_TYPE == 'debug' || env.BUILD_TYPE == 'both'
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK
        if: env.BUILD_TYPE == 'release' || env.BUILD_TYPE == 'both'
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Collect APKs
        id: collect
        run: |
          set -euo pipefail
          mkdir -p artifacts
          SHORT_SHA="$(git rev-parse --short HEAD)"
          found=0
          for apk in $(find app/build/outputs/apk -name '*.apk' 2>/dev/null); do
            variant="$(basename "$(dirname "$apk")")"
            cp "$apk" "artifacts/Custodia-${variant}-${SHORT_SHA}.apk"
            found=1
          done
          if [ "$found" -eq 0 ]; then
            echo "No APK produced" >&2
            exit 1
          fi
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          ls -lh artifacts

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: custodia-apk-${{ steps.collect.outputs.short_sha }}
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test & lint reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-${{ github.run_id }}
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Job summary
        if: always()
        run: |
          {
            echo "### Custodia Android CI"
            echo ""
            echo "- Commit: \`${GITHUB_SHA:0:7}\`"
            echo "- Build type: \`${BUILD_TYPE}\`"
            echo "- Tests: \`${RUN_TESTS}\`"
            echo ""
            if [ -d artifacts ]; then
              echo "| APK | Size |"
              echo "| --- | ---- |"
              for f in artifacts/*.apk; do
                [ -e "$f" ] || continue
                echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"
